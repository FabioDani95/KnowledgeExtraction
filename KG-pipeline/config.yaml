# Knowledge Extraction Pipeline Configuration

# === Content Filtering Settings ===
filtering:
  enabled: false                      # Master switch (abilita/disabilita tutti i filtri)

  # Pattern-based filtering
  pattern_filtering:
    enabled: true
    skip_patterns:
      - "^table of contents$"
      - "^index$"
      - "warranty"
      - "legal notice"
      - "page \\d+"
      - "^appendix"
      - "^bibliography"
      - "^references$"
    case_sensitive: false            # Ignora maiuscole/minuscole nei pattern
    match_scope: "title"             # Dove applicare i pattern: title, text, both
    max_text_scan_chars: 2000        # Numero max caratteri da esaminare nel testo per match

  # Content quality
  content_quality:
    enabled: true
    min_text_length: 100             # Min caratteri totali richiesti
    max_whitespace_ratio: 0.8        # Scarta se oltre 80% è spazio bianco
    min_non_whitespace_chars: 50     # Min caratteri "significativi"

  # Language detection
  language_detection:
    enabled: true
    target_language: "en"            # Lingua attesa delle sezioni
    min_text_for_detection: 50       # Min caratteri per tentare detection
    confidence_threshold: 0.7        # Soglia confidenza minima accettata
    fallback_on_error: true          # Se detection fallisce, tieni la sezione

  # Structural filtering
  structural_filtering:
    enabled: true
    skip_section_titles:
      - "table of contents"
      - "index"
      - "warranty"
      - "legal notice"
      - "disclaimer"
      - "copyright"
      - "trademark"
    max_chars_per_section: 10000     # Spezza sezioni troppo grandi (soft split)

# === PDF Processing Settings ===
pdf_processing:
  datasource_code: "SRC_DOCS_PIPELINE5"
  default_language: "en"
  skip_start_pages: 1  # Numero di pagine da saltare all'inizio del PDF (per escludere copertine, copyright, ecc)
  skip_end_pages: 1     # Numero di pagine finali da saltare (per escludere appendici inutili, pubblicità, ecc)

# === Output Settings ===
output:
  individual_files: true
  batch_file: false
  indent: 2
  ensure_ascii: false

# === Logging Settings ===
logging:
  level: "INFO"           # (DEBUG, INFO, WARNING, ERROR)
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Symbolic Merge Settings ===
merge_settings:
  allowed_entity_types:
    - "Product"
    - "Component"
    - "ComponentType"
    - "RatingPlate"
    - "ParameterSpec"
    - "Unit"
    - "MachineMode"
    - "ProcessStep"
    - "State"
    - "FailureMode"
    - "RepairAction"
    - "Tool"
    - "Consumable"
    - "MaintenanceTask"
  allowed_relation_types:
    - "hasPart"
    - "belongsTo"
    - "instanceOf"
    - "hasSpec"
    - "hasUnit"
    - "connectedTo"
    - "precedes"
    - "appliesDuring"
    - "verifies"
    - "requiresTool"
    - "requiresConsumable"
    - "resolves"
    - "leadsTo"

# === Neural Extractor Module ===
neural_extractor:
  enabled: false
  provider: "openai"               # 'openai' or other provider id used by the module
  model: "gpt-4o-mini"
  #model: "gpt-4o"             # gpt-4o-mini: più economico; aumenta a gpt-4o per qualità maggiore
  api_key_env: "OPENAI_API_KEY"
  temperature: 0.15                # temperatura bassa per output più deterministici (0.1-0.2 consigliato)
  max_output_tokens: 1500
  request_timeout: 60              # timeout (secondi) per le chiamate al modello
  max_tokens_per_chunk: 1000       # massimo numero di token per chunk di testo
  retry_on_failure: true           # retry automatico con prompt semplificato
  save_raw_outputs: true           # salva input/output raw per debug

# === Neural Extraction Profiles ===
neural_extraction_profiles:
  product_technical:
    input_glob: "output/partial/product_technical/*.json"
    output_dir: "output/neural_extraction/product_technical"
    class_map:
      - "Product"
      - "ComponentType"
      - "Component"
      - "ParameterSpec"
      - "Unit"
      - "RatingPlate"
    relation_map:
      - "hasPart"
      - "belongsTo"
      - "instanceOf"
      - "hasSpec"
      - "hasUnit"
      - "connectedTo"
      - "hasRatingPlate"

  operation_modes:
    input_glob: "output/partial/operation_modes/*.json"
    output_dir: "output/neural_extraction/operation_modes"
    class_map:
      - "MachineMode"
      - "State"
      - "ProcessStep"
      - "TestSpec"
    relation_map:
      - "precedes"
      - "appliesDuring"
      - "verifies"

  troubleshooting:
    input_glob: "output/partial/troubleshooting/*.json"
    output_dir: "output/neural_extraction/troubleshooting"
    class_map:
      - "FailureMode"
      - "RepairAction"
      - "MaintenanceTask"
      - "Tool"
      - "Consumable"
    relation_map:
      - "affects"
      - "mitigatedBy"
      - "requiresTool"
      - "requiresConsumable"
      - "verifies"

  testing:
    input_glob: "output/partial/testing/*.json"
    output_dir: "output/neural_extraction/testing"
    class_map:
      - "TestCase"
      - "SafetyNotice"
      - "Measurement"
      - "AcceptanceCriterion"
      - "Equipment"
      - "ApplicabilityClause"
      - "NormativeReference"
      - "CrossReference"
    relation_map:
      - "requires"
      - "validatedBy"
      - "appliesTo"
      - "constrainedBy"
      - "refersTo"

# === Pipeline Settings ===
pipelines:
  product_technical:
    enabled: true
    source_dir: "source/product_technical"
    output_dir: "output/partial/product_technical"
    document_glob: "*.pdf"
    symbolic:
      skip_header_footer_patterns:
        footer: "citiz service manual\\s+\\d+$"
        header: "^[A-Z\\s]+\\|$"
        page_number: "^\\s*\\d+\\s*$"
        decoration: "^[\\-|\\s─═]+$"
      section_patterns:
        level1: "^\\d+\\s+[A-Z][A-Z\\s&]+$"
        level2: "^\\d+\\.\\d+\\s+.+$"
        level3: "^\\d+\\.\\d+\\.\\d+\\s+.+$"
      role_heuristics:
        figure_keywords:
          - "diagram"
          - "view"
          - "schematic"
          - "overview"
        table_keywords:
          - "|"
          - "table"
          - "specification"
          - "rating"
        warning_keywords:
          - "warning"
          - "caution"
          - "danger"
          - "note"
          - "important"
      tagging_keywords:
        component_list_pattern: "^\\s*\\d+\\)"
        dimensions:
          - "mm"
          - "kg"
          - "width"
          - "height"
          - "depth"
          - "dimension"
        electrical:
          - "voltage"
          - "hz"
          - "amp"
          - "watt"
          - "v "
        model_codes:
          - "c110"
          - "d120"
          - "c170"
        brand:
          - "delonghi"
          - "krups"
          - "magimix"
          - "nespresso"
      table_detection:
        dotted_leader_threshold: 3
        min_pipe_columns: 3
        min_consistent_rows: 3
        max_separator_variance: 2
      quality_thresholds:
        min_text_coverage: 0.7
      rating_plate:
        enabled: true
        title_keywords:
          - "rating plate"
          - "rating plates"
        brands:
          - "nespresso"
          - "delonghi"
          - "koenig"
          - "krups"
          - "magimix"
          - "turmix"
        region_tokens:
          - "eu"
          - "ch"
          - "at"
          - "us"
          - "uk"
          - "apac"
          - "me"
        default_tags:
          - "rating_plate"
          - "brand_specific"
      implicit_subsections:
        enabled: true
        heading_patterns:
          - "^([A-Z][A-Za-z0-9\\s,&-]+):?$"
          - "^([A-Z][A-Z\\s/&-]+)$"
        max_heading_words: 8
        min_block_chars: 40
      warning_detection:
        enabled: true
        snippet_window: 120
        promote_role_max_chars: 600
        patterns:
          - "(WARNING|CAUTION|DANGER|IMPORTANT|ATTENTION)"
          - "(not compatible|incompatible)"
          - "(do not|never|avoid).{0,50}(mix|combine|use with)"
          - "(must not|cannot be used|will not work)"
          - "^Note:?|^Nota:?"
  operation_modes:
    enabled: true
    source_dir: "source/operation_modes"
    output_dir: "output/partial/operation_modes"
    document_glob: "*.pdf"
    symbolic:
      skip_header_footer_patterns:
        footer: "citiz service manual\\s+\\d+$"
        header: "^[A-Z\\s]+\\|$"
        page_number: "^\\s*\\d+\\s*$"
        decoration: "^[\\-|\\s─═]+$"
      page_classification:
        status_keywords:
          must_include:
            - "machine status"
            - "led signal"
        mode_keywords:
          must_include:
            - "machine mode"
            - "enter mode"
        procedure_pattern: "^\\s*\\d+\\)"
        min_procedure_steps: 2
      status_table:
        csv_headers:
          - "Status"
          - "LED_Signal"
        icon_tokens:
          - "●"
          - "◐"
          - "◑"
          - "◯"
          - "○"
          - "◦"
          - "•"
          - "▪"
        tag: "status_indicators"
        format: "icon_table_simplified"
      mode_table:
        header_keywords:
          - "machine mode"
          - "enter mode"
        bullet_tokens:
          - "•"
          - "-"
          - "–"
        csv_format: "flattened_bullets"
        tag: "machine_modes"
      procedure:
        step_pattern: "^\\s*(\\d+)\\)\\s+(.+)"
        tag: "procedure"
        procedure_type: "step_by_step"
        figure_type: "diagram"
        synchronized_figures: true
      generic:
        tag: "operation_text"
  troubleshooting:
    enabled: true
    source_dir: "source/troubleshooting"
    output_dir: "output/partial/troubleshooting"
    document_glob: "*.pdf"
    symbolic:
      skip_header_footer_patterns:
        footer: "citiz service manual\\s+\\d+$"
        header: "^[A-Z\\s]+\\|$"
        page_number: "^\\s*\\d+\\s*$"
        decoration: "^[\\-|\\s─═]+$"
      page_classification:
        decision_keywords:
          - "check"
          - "error symptoms"
          - "measure"
        torque_keywords:
          - "torque"
          - "screw"
        safety_keywords:
          - "risk"
          - "danger"
          - "⚠"
        max_warning_role_chars: 500
      decision_tree:
        check_pattern: "(\\d+)\\s+(.+)"
        subcheck_pattern: "(\\d+\\.\\d+)\\s+(.+)"
        branch_pattern: "(YES|NO)\\s*(?:[-–—:\\u00ad])?\\s*(.*?)(?=(YES|NO)\\s*(?:[-–—:\\u00ad]|$)|$)"
        table_id: "tbl_troubleshooting"
        format: "hierarchical_decision_tree"
        tags:
          - "troubleshooting"
          - "checklist"
      torque_table:
        value_pattern: "(\\d+)\\s*\\(\\+(\\d+)/-(\\d+)\\)\\s*(Ncm|Nm)"
        csv_headers:
          - "Component"
          - "Nominal"
          - "Tolerance_plus"
          - "Tolerance_minus"
          - "Unit"
        table_id: "tbl_torque_specs"
        format: "technical_specs"
        tags:
          - "torque"
          - "repair"
      safety_detection:
        snippet_chars: 220
        tags:
          - "safety"
        patterns:
          - "(⚠️|⚠|Risk of|Danger of)"
          - "(fatal electrical shock|burns|hot parts|injury)"
      generic:
        tag: "troubleshooting_text"
  testing:
    enabled: true
    source_dir: "source/testing"
    output_dir: "output/partial/testing"
    document_glob: "*.pdf"
    symbolic:
      skip_header_footer_patterns:
        header: "^(test\\s+report|quality\\s+check).*$"
        footer: "^(confidential|internal use).*"
        page_number: "^\\s*\\d+\\s*$"
        decoration: "^[\\-|\\s─═]+$"
      section_heading_patterns:
        - "^(Test|Case|Scenario)\\s+\\d+"
        - "^([A-Z][A-Za-z0-9\\s]+):$"
        - "^\\d+(\\.\\d+){0,3}\\s+[A-Z].+"
      test_case_keywords:
        outcome:
          - "pass"
          - "passed"
          - "fail"
          - "failed"
        requirement:
          - "requirement"
          - "criteria"
          - "expected result"
        step:
          - "test"
          - "verification"
          - "sequence"
      min_section_chars: 20
      default_role: "main"
      safety_markers:
        - "danger"
        - "warning"
        - "caution"
        - "note"
        - "notice"
      acceptance_patterns:
        - "must be"
        - "should be"
        - "shall be"
        - "at least"
        - "at most"
        - "lower than"
        - "less than"
        - "greater than"
        - "higher than"
        - "between"
        - "±"
        - ">="
        - "<="
        - ">"
        - "<"
      unit_patterns:
        - "bar"
        - "ml"
        - "°C"
        - "°F"
        - "C"
        - "F"
        - "Ohm"
        - "Ω"
        - "kOhm"
        - "kΩ"
        - "mA"
        - "V DC"
        - "VDC"
        - "sec"
        - "s"
      block_markers:
        precondition_markers:
          - "prerequisite"
          - "preparations"
        procedure_markers:
          - "test run"
          - "test sequence"
          - "procedure"
          - "description"
        equipment_markers:
          - "test equipment"
          - "tools"
          - "measuring cup"
          - "pressure tester"
          - "multimeter"
        applicability_markers:
          - "only necessary"
          - "for class"
          - "for models"
          - "after a repair"
          - "additional tests"
        measurement_markers:
          - "measurement table"
          - "measurement"
          - "diagram"
          - "graph"
          - "ntc"
        general_markers:
          - "general"
          - "overview"
        safety_markers:
          - "danger"
          - "warning"
          - "caution"
          - "note"
          - "notice"
      step_markers_regex:
        - "^\\d+\\)"
        - "^\\d+\\.\\s"
        - "^[•\\-–]\\s"

# === KG Validation Settings ===
validations:
  json_shape:            { severity: error }
  referential_integrity: { severity: error }
  no_self_loops:         { severity: warn }

  domain_range:
    severity: error
    rules:
      hasUnit:            { domain: ["ParameterSpec"], range: ["Unit"] }
      hasSpec:            { domain: ["Product","Component","ComponentType"], range: ["ParameterSpec"] }
      requiresTool:       { domain: ["RepairAction"], range: ["Tool"] }
      requiresConsumable: { domain: ["RepairAction"], range: ["Consumable"] }
      precedes:           { domain: ["MachineMode","ProcessStep"], range: ["MachineMode","ProcessStep"] }

  dedup_relations:  { severity: info }

  precedes_acyclic: { severity: error }

  units_required_if_numeric: { severity: warn }

  min_confidence_entity:   { severity: warn, threshold: 0.75 }
  min_confidence_relation: { severity: warn, threshold: 0.75 }
